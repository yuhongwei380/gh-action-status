services:
  runner-beacon:
    build: .
    image: runner-beacon:local
    container_name: runner-beacon
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin}"
      APP_SECRET: "${APP_SECRET:-change-me-before-production}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    volumes:
      - runner-beacon-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  runner-beacon-data:

